# CI: format, vet and build on every push and PR; the full race-enabled
# test suite against a throwaway PostgreSQL; on develop, a container image.
# Tests use fakes only; no repository secret is needed or exposed here.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  check:
    name: fmt · vet · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l cmd internal)
          if [ -n "$out" ]; then
            echo "::error::gofmt needed:"; echo "$out"
            { echo "### gofmt needed"; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - name: doc paths
        run: scripts/check-doc-paths.sh

  test:
    name: test (race, postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: nexus_storage_test
        ports: ["5434:5432"]   # tests require 127.0.0.1:5434
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_storage_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-throwaway@127.0.0.1:5434/nexus_storage_test?sslmode=disable
      GOTESTSUM_VERSION: v1.12.3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@${GOTESTSUM_VERSION}
      - name: git identity for repository tests
        run: |
          git config --global user.name "nexus-ci"
          git config --global user.email "ci@nexus.invalid"
          git config --global init.defaultBranch main
      - name: go test -race
        run: |
          set -o pipefail
          gotestsum --format testname --jsonfile test.json --junitfile junit.xml \
            -- -race -count=1 ./... 2>&1 | tee test.log
      - name: Summary
        if: always()
        run: |
          [ -f test.json ] || exit 0
          pass=$(jq -s '[.[]|select(.Test and .Action=="pass")]|length' test.json)
          fail=$(jq -s '[.[]|select(.Test and .Action=="fail")]|length' test.json)
          skip=$(jq -s '[.[]|select(.Test and .Action=="skip")]|length' test.json)
          {
            echo "### Tests on \`${GITHUB_SHA::7}\`: ${pass} passed, ${fail} failed, ${skip} skipped"
            if [ "$fail" != 0 ]; then
              echo; echo "**Failed**"; echo '```'
              jq -r 'select(.Test and .Action=="fail")|"\(.Package|sub("github.com/LDKhangg/nexus-hub/";""))  \(.Test)"' test.json
              echo '```'
            fi
            if [ "$skip" != 0 ]; then
              echo; echo "**Skipped**"; echo '```'
              jq -r 'select(.Test and .Action=="skip")|"\(.Package|sub("github.com/LDKhangg/nexus-hub/";""))  \(.Test)"' test.json
              echo '```'
            fi
            if grep -q "WARNING: DATA RACE" test.log; then echo; echo "**Data race detected** (see test.log)"; fi
            if grep -q "^panic:" test.log; then echo; echo "**Panic detected** (see test.log)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.sha }}
          path: |
            test.log
            test.json
            junit.xml
          retention-days: 14
          if-no-files-found: ignore

  image:
    name: container image
    needs: [check, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
